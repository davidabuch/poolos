name: PoolOS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install PoolOS and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile source
        run: python -m compileall poolos intellicenter

      - name: Run Ruff
        run: python -m ruff check poolos intellicenter tests

      - name: Run MyPy
        run: python -m mypy poolos

      - name: Run test suite
        run: python -m pytest

      - name: Check patch whitespace
        run: git diff --check
