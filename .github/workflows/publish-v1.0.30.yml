name: Publish PoolOS v1.0.30

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v1.0.30.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish immutable v1.0.30 tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: bc920ef83f690c92fef541ddcf0c2fa4a36ffdc7
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/v1.0.30" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 v1.0.30)" = "$RELEASE_SHA"
          else
            git tag -a v1.0.30 "$RELEASE_SHA" -m "PoolOS v1.0.30"
            git push origin refs/tags/v1.0.30
          fi
          if gh release view v1.0.30 >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v1.0.30 \
            --verify-tag \
            --title "PoolOS v1.0.30" \
            --notes "Home Assistant liveness recovery. Preserves v1.0.29 filtration completion and connected idle observation while suppressing repeated publication of an unchanged cached snapshot when configured IntelliCenter transport is disconnected and supplies no new evidence. Live incident evidence showed Supervisor watchdog repeatedly restarting Core after two missed API responses; disabling PoolOS stopped the restart loop. PR #460 and the release PR passed PoolOS CI, Hassfest, and HACS validation."
