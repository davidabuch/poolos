name: Publish PoolOS v1.0.31

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v1.0.31.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish immutable v1.0.31 tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: fe7f780bd6b1af0533b2a0b4eb606c58d8acb0c2
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/v1.0.31" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 v1.0.31)" = "$RELEASE_SHA"
          else
            git tag -a v1.0.31 "$RELEASE_SHA" -m "PoolOS v1.0.31"
            git push origin refs/tags/v1.0.31
          fi
          if gh release view v1.0.31 >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v1.0.31 \
            --verify-tag \
            --title "PoolOS v1.0.31" \
            --notes "Home Assistant liveness hardening: preserves full native evidence and verification cadence while coalescing HA entity publication to semantic changes, removing duplicate event publication, and preventing failed canonical native reads from fanning stale state across every PoolOS entity. Includes v1.0.29 filtration-completion authority repair. Repository validation green on PoolOS CI, Hassfest, and HACS validation."
