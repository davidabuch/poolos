name: Publish PoolOS v1.0.29

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v1.0.29.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish immutable v1.0.29 tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: 7bc8cdf18c23a425f214d986f1fc315e017cc000
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/v1.0.29" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 v1.0.29)" = "$RELEASE_SHA"
          else
            git tag -a v1.0.29 "$RELEASE_SHA" -m "PoolOS v1.0.29"
            git push origin refs/tags/v1.0.29
          fi
          if gh release view v1.0.29 >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v1.0.29 \
            --verify-tag \
            --title "PoolOS v1.0.29" \
            --notes "Restores native observation liveness during idle periods and repairs filtration completion authority so PoolOS retains provenance through BODY-OFF/pump coastdown, verifies actual pump zero before releasing completion responsibility, fences reordered pre-completion telemetry from pump-only reacquisition, and preserves manual/external Pool ownership semantics. Repository validation: 3,974 tests passed with PoolOS CI, Hassfest, and HACS validation green. Physical filtration shutdown/reacquisition commissioning remains required."
