title: PoolOS Operations Center
views:
  - title: Live Operations
    path: poolos-live
    icon: mdi:pool
    type: sections
    max_columns: 4
    sections:
      - type: grid
        title: PoolOS Status
        cards:
          - type: markdown
            content: >-
              ## OBSERVE ONLY
              **Authority: NONE · Command delivery: DISABLED**

              Recommendations are advisory commissioning evidence only; PoolOS cannot actuate equipment. No actuation occurs.
          - type: tile
            entity: sensor.poolos_control_center_observation_health
            name: Observation Health
          - type: tile
            entity: sensor.poolos_control_center_health_incident_since_restart
            name: Health Incident Since Reset
          - type: tile
            entity: sensor.poolos_control_center_expected_outage_annotation
            name: Expected Outage Annotation
          - type: tile
            entity: sensor.poolos_control_center_observation_quality
            name: Observation Quality
          - type: tile
            entity: sensor.poolos_control_center_observation_coverage
            name: Observation Coverage
          - type: tile
            entity: sensor.poolos_control_center_observation_incidents_today
            name: Incidents Today
          - type: button
            entity: button.poolos_control_center_reset_health_incident
            name: Reset Health Incident
            icon: mdi:restore-alert
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.poolos_control_center_reset_health_incident
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.poolos_control_center_expected_outage_annotation
                state_not: ACTIVE
            card:
              type: tile
              entity: sensor.poolos_control_center_expected_outage_annotation
              name: Acknowledge Expected Outage
              icon: mdi:power-plug-off-outline
              hide_state: true
              tap_action:
                action: perform-action
                perform_action: button.press
                target:
                  entity_id: button.poolos_control_center_acknowledge_expected_pentair_outage
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.poolos_control_center_expected_outage_annotation
                state: ACTIVE
            card:
              type: tile
              entity: sensor.poolos_control_center_expected_outage_annotation
              name: EXPECTED OUTAGE ACTIVE
              icon: mdi:power-plug-off-outline
              color: red
              tap_action:
                action: perform-action
                perform_action: button.press
                target:
                  entity_id: button.poolos_control_center_acknowledge_expected_pentair_outage
          - type: markdown
            content: |
              {% set entity = 'sensor.poolos_control_center_expected_outage_annotation' %}
              {% set acknowledged = state_attr(entity, 'last_acknowledged_at') %}
              {% set window_start = state_attr(entity, 'matching_window_start') %}
              {% set window_end = state_attr(entity, 'matching_window_end') %}
              {% set matched = state_attr(entity, 'matched_incident_count') %}
              {% set outage_start = state_attr(entity, 'most_recent_matched_outage_start') %}
              {% set outage_end = state_attr(entity, 'most_recent_matched_outage_end') %}
              **Expected Outage Annotation — {{ states(entity) }}**

              {% if acknowledged %}
              **Acknowledged:** {{ as_timestamp(acknowledged) | timestamp_custom('%b %-d, %-I:%M %p %Z', true) }}

              **Matching window:** {{ as_timestamp(window_start) | timestamp_custom('%-I:%M %p %Z', true) }} – {{ as_timestamp(window_end) | timestamp_custom('%-I:%M %p %Z', true) }}

              **Matched incidents:** {{ matched | default(0, true) }}
              {% if outage_start %}

              **Most recent matched outage:** {{ as_timestamp(outage_start) | timestamp_custom('%b %-d, %-I:%M %p %Z', true) }}{% if outage_end %} – {{ as_timestamp(outage_end) | timestamp_custom('%-I:%M %p %Z', true) }}{% else %} – OPEN{% endif %}
              {% endif %}
              {% else %}
              No expected-outage acknowledgment has been recorded.
              {% endif %}
          - type: markdown
            content: >-
              **Expected outage** records annotation context only and never
              suppresses live health. **Reset health incident** clears only the
              diagnostic latch after recovery. Neither button controls Pentair.
          - type: tile
            entity: sensor.poolos_control_center_inferred_operating_state
            name: Inferred State
          - type: tile
            entity: sensor.poolos_control_center_solar_behavior_inference
            name: Solar Inference
          - type: tile
            entity: sensor.poolos_control_center_solar_transitions_today
            name: Solar Transitions Today
          - type: tile
            entity: sensor.poolos_control_center_solar_learning_quality
            name: Solar Learning Quality
          - type: tile
            entity: sensor.poolos_control_center_recorder_status
            name: Daily Evidence Recorder
          - type: entities
            title: Native IntelliCenter Shadow Parity
            show_header_toggle: false
            entities:
              - entity: sensor.poolos_control_center_independent_intellicenter_transport
                name: Independent Read-Only Transport
              - entity: sensor.poolos_control_center_native_intellicenter_status
                name: Native Status
              - entity: sensor.poolos_control_center_native_intellicenter_parity
                name: Parity
              - entity: sensor.poolos_control_center_native_intellicenter_matched_concepts
                name: Matched Concepts
              - entity: sensor.poolos_control_center_native_intellicenter_mismatches
                name: Parity Issues
              - entity: sensor.poolos_control_center_native_intellicenter_snapshot_inventory
                name: Native Snapshot Inventory
              - entity: sensor.poolos_control_center_native_intellicenter_mapped_concepts
                name: Native Mapped Concepts
              - entity: sensor.poolos_control_center_native_intellicenter_parity_issues
                name: Native Parity Issue Details
      - type: grid
        title: Grid & Resilience
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.poolos_control_center_grid_available
                name: Grid Available
              - entity: sensor.poolos_control_center_grid_outage_active
                name: Grid Outage Active
          - type: markdown
            content: >-
              **Future Powerwall conservation:** if the grid goes down, PoolOS will
              eventually cap required circulation at **1800 RPM** and shed
              nonessential pool loads. Current commissioning remains observation-only.
      - type: grid
        title: Pool Lighting
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.poolos_control_center_pool_light_active
                name: Pool Light Active
              - entity: sensor.poolos_control_center_pool_light_color_mode
                name: Pool Light Color Mode
              - entity: sensor.poolos_control_center_pool_light_scene_effect
                name: Pool Light Scene / Effect
          - type: markdown
            content: >-
              PoolOS observes pool-light power and the Home Assistant-reported
              color mode / scene for commissioning evidence. Light control remains disabled.
      - type: grid
        title: Hydraulics
        cards:
          - type: gauge
            entity: sensor.poolos_control_center_pump_rpm
            name: Pump RPM
            min: 0
            max: 3450
          - type: gauge
            entity: sensor.poolos_control_center_pump_gpm
            name: Flow
            min: 0
            max: 120
          - type: gauge
            entity: sensor.poolos_control_center_pump_power
            name: Pump Power
            min: 0
            max: 3000
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.poolos_control_center_pool_active
                name: Pool Active
              - entity: sensor.poolos_control_center_spa_active
                name: Spa Active
              - entity: sensor.poolos_control_center_pool_command_active
                name: Pool Command
              - entity: sensor.poolos_control_center_spa_command_active
                name: Spa Command
      - type: grid
        title: Temperatures
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.poolos_control_center_pool_temperature
                name: Pool Temperature
              - entity: sensor.poolos_control_center_pool_target_temperature
                name: Pool Target
              - entity: sensor.poolos_control_center_spa_temperature
                name: Spa Temperature
              - entity: sensor.poolos_control_center_spa_target_temperature
                name: Spa Target
              - entity: sensor.poolos_control_center_water_temperature
                name: Water Temperature
              - entity: sensor.poolos_control_center_solar_roof_temperature
                name: Solar Roof Temperature
              - entity: sensor.poolos_control_center_air_temperature
                name: Air Temperature
          - type: history-graph
            title: Temperature History
            hours_to_show: 6
            entities:
              - entity: sensor.poolos_control_center_pool_temperature
                name: Pool
              - entity: sensor.poolos_control_center_water_temperature
                name: Water
              - entity: sensor.poolos_control_center_solar_roof_temperature
                name: Solar Roof
              - entity: sensor.poolos_control_center_air_temperature
                name: Air
      - type: grid
        title: Heating and Solar
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.poolos_control_center_solar_active
                name: Solar Active
              - entity: sensor.poolos_control_center_gas_heater_active
                name: Gas Heater
              - entity: sensor.poolos_control_center_pool_heating_demand
                name: Pool Heating Demand
              - entity: sensor.poolos_control_center_spa_heating_demand
                name: Spa Heating Demand
              - entity: sensor.poolos_control_center_solar_preferred
                name: Solar Preferred
          - type: history-graph
            title: Hydraulics History
            hours_to_show: 6
            entities:
              - entity: sensor.poolos_control_center_pump_rpm
                name: RPM
              - entity: sensor.poolos_control_center_pump_gpm
                name: GPM
              - entity: sensor.poolos_control_center_pump_power
                name: Power
      - type: grid
        title: Water Features
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.poolos_control_center_waterfall_active
                name: Waterfall
              - entity: sensor.poolos_control_center_jets_active
                name: Jets
              - entity: sensor.poolos_control_center_slide_active
                name: Slide
      - type: grid
        title: Evidence and Analysis
        cards:
          - type: entities
            title: Commissioning Evidence
            show_header_toggle: false
            entities:
              - entity: sensor.poolos_control_center_commissioning_evidence_status
                name: Evidence Status
              - entity: sensor.poolos_control_center_good_observation_days
                name: Good Days
              - entity: sensor.poolos_control_center_usable_solar_learning_days
                name: Solar Learning Days
              - entity: sensor.poolos_control_center_complete_solar_episodes
                name: Complete Solar Episodes
          - type: entity
            entity: sensor.poolos_control_center_recorder_status
            name: Recorder / Export Status
          - type: entity
            entity: sensor.poolos_control_center_daily_operational_retrospective
            name: Today's Operation
          - type: entity
            entity: sensor.poolos_control_center_last_shadow_explanation
            name: Latest Explanation
          - type: entities
            title: Full PoolOS Diagnostics
            show_header_toggle: false
            entities:
              - entity: sensor.poolos_control_center_operating_mode
                name: Operating Mode
              - entity: sensor.poolos_control_center_commissioning_stage
                name: Commissioning Stage
              - entity: sensor.poolos_control_center_shadow_runtime_status
                name: Shadow Runtime
              - entity: sensor.poolos_control_center_last_evaluation
                name: Last Evaluation
              - entity: sensor.poolos_control_center_current_shadow_objective
                name: Current Objective
              - entity: sensor.poolos_control_center_last_shadow_plan
                name: Last Shadow Plan
              - entity: sensor.poolos_control_center_daily_counterfactual_report
                name: Counterfactual Report
              - entity: sensor.poolos_control_center_operator_recommendation
                name: Operator Recommendation
          - type: markdown
            content: >-
              Daily evidence is exported automatically to `/config/poolos_logs/`
              as both JSONL and CSV. Upload the files for the desired date to
              ChatGPT for timeline and behavioral analysis.
