title: PoolOS Control Center
views:
  - title: Commissioning
    path: poolos-commissioning
    icon: mdi:pool
    type: sections
    sections:
      - type: grid
        title: Authority and Safety
        cards:
          - type: entities
            title: PoolOS Authority
            show_header_toggle: false
            entities:
              - entity: sensor.poolos_operating_mode
                name: Operating Mode
              - entity: sensor.poolos_commissioning_stage
                name: Commissioning Stage
              - type: section
                label: PoolOS is read-only. Command delivery is disabled.
      - type: grid
        title: Observation
        cards:
          - type: tile
            entity: sensor.poolos_observation_health
            name: Observation Health
          - type: tile
            entity: sensor.poolos_last_evaluation
            name: Last Evaluation
      - type: grid
        title: Shadow Runtime
        cards:
          - type: tile
            entity: sensor.poolos_shadow_runtime_status
            name: Shadow Status
          - type: tile
            entity: sensor.poolos_current_objective
            name: Current Objective
          - type: tile
            entity: sensor.poolos_last_plan
            name: Last Plan
      - type: grid
        title: Behavioral Inference
        cards:
          - type: tile
            entity: sensor.poolos_inferred_operating_state
            name: Inferred Operating State
          - type: entity
            entity: sensor.poolos_solar_behavior_inference
            name: Solar Behavior Inference
          - type: markdown
            content: >-
              Behavioral inference is derived from recorded observations. It is not
              an asserted IntelliCenter rule and does not provide control authority.
      - type: grid
        title: Daily Retrospective
        cards:
          - type: entity
            entity: sensor.poolos_daily_operational_retrospective
            name: Daily Actual Operation
          - type: entity
            entity: sensor.poolos_daily_counterfactual_report
            name: PoolOS Counterfactual
          - type: markdown
            content: >-
              The retrospective compares durable observed evidence with available
              PoolOS advisory evidence. Missing runtime or timing targets are reported
              as unavailable rather than inferred. No actuation occurs.
      - type: grid
        title: Operator Recommendation
        cards:
          - type: entity
            entity: sensor.poolos_operator_recommendation
            name: Current Recommendation
          - type: markdown
            content: >-
              Recommendations are advisory commissioning evidence only. PoolOS has
              no command authority and cannot actuate equipment.
      - type: grid
        title: Explanation
        cards:
          - type: entity
            entity: sensor.poolos_last_explanation
            name: Why PoolOS reached this result
          - type: markdown
            content: >-
              PoolOS is operating without authority. Shadow plans and explanations
              are commissioning evidence only and cannot control equipment.
