title: PoolOS Operations Center
views:
  - title: Live Operations
    path: poolos-live
    icon: mdi:pool
    type: sections
    max_columns: 4
    sections:
      - type: grid
        title: PoolOS Status
        cards:
          - type: markdown
            content: >-
              ## OBSERVE ONLY
              **Authority: NONE · Command delivery: DISABLED**

              Recommendations are advisory commissioning evidence only; PoolOS cannot actuate equipment. No actuation occurs.
          - type: tile
            entity: sensor.poolos_control_center_observation_health
            name: Observation Health
          - type: tile
            entity: sensor.poolos_control_center_inferred_operating_state
            name: Inferred State
          - type: tile
            entity: sensor.poolos_control_center_solar_behavior_inference
            name: Solar Inference
          - type: tile
            entity: sensor.poolos_control_center_recorder_status
            name: Daily Evidence Recorder
      - type: grid
        title: Grid & Resilience
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.poolos_control_center_grid_available
                name: Grid Available
              - entity: sensor.poolos_control_center_grid_outage_active
                name: Grid Outage Active
          - type: markdown
            content: >-
              **Future Powerwall conservation:** if the grid goes down, PoolOS will
              eventually cap required circulation at **1800 RPM** and shed
              nonessential pool loads. Current commissioning remains observation-only.
      - type: grid
        title: Pool Lighting
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.poolos_control_center_pool_light_active
                name: Pool Light Active
              - entity: sensor.poolos_control_center_pool_light_color_mode
                name: Pool Light Color Mode
              - entity: sensor.poolos_control_center_pool_light_scene_effect
                name: Pool Light Scene / Effect
          - type: markdown
            content: >-
              PoolOS observes pool-light power and the Home Assistant-reported
              color mode / scene for commissioning evidence. Light control remains disabled.
      - type: grid
        title: Hydraulics
        cards:
          - type: gauge
            entity: sensor.poolos_control_center_pump_rpm
            name: Pump RPM
            min: 0
            max: 3450
          - type: gauge
            entity: sensor.poolos_control_center_pump_gpm
            name: Flow
            min: 0
            max: 120
          - type: gauge
            entity: sensor.poolos_control_center_pump_power
            name: Pump Power
            min: 0
            max: 3000
          - type: entities
            show_header_toggle: false
            entities:
              - sensor.poolos_control_center_pool_active
              - sensor.poolos_control_center_spa_active
              - sensor.poolos_control_center_pool_command_active
              - sensor.poolos_control_center_spa_command_active
      - type: grid
        title: Temperatures
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - sensor.poolos_control_center_pool_temperature
              - sensor.poolos_control_center_pool_target_temperature
              - sensor.poolos_control_center_spa_temperature
              - sensor.poolos_control_center_spa_target_temperature
              - sensor.poolos_control_center_water_temperature
              - sensor.poolos_control_center_solar_roof_temperature
              - sensor.poolos_control_center_air_temperature
          - type: history-graph
            title: Temperature History
            hours_to_show: 6
            entities:
              - sensor.poolos_control_center_pool_temperature
              - sensor.poolos_control_center_water_temperature
              - sensor.poolos_control_center_solar_roof_temperature
              - sensor.poolos_control_center_air_temperature
      - type: grid
        title: Heating and Solar
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - sensor.poolos_control_center_solar_active
              - sensor.poolos_control_center_gas_heater_active
              - sensor.poolos_control_center_pool_heating_demand
              - sensor.poolos_control_center_spa_heating_demand
              - sensor.poolos_control_center_solar_preferred
          - type: history-graph
            title: Hydraulics History
            hours_to_show: 6
            entities:
              - sensor.poolos_control_center_pump_rpm
              - sensor.poolos_control_center_pump_gpm
              - sensor.poolos_control_center_pump_power
      - type: grid
        title: Water Features
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - sensor.poolos_control_center_waterfall_active
              - sensor.poolos_control_center_jets_active
              - sensor.poolos_control_center_slide_active
      - type: grid
        title: Evidence and Analysis
        cards:
          - type: entity
            entity: sensor.poolos_control_center_recorder_status
            name: Recorder / Export Status
          - type: entity
            entity: sensor.poolos_control_center_daily_operational_retrospective
            name: Today's Operation
          - type: entity
            entity: sensor.poolos_control_center_last_shadow_explanation
            name: Latest Explanation
          - type: entities
            title: Full PoolOS Diagnostics
            show_header_toggle: false
            entities:
              - sensor.poolos_control_center_operating_mode
              - sensor.poolos_control_center_commissioning_stage
              - sensor.poolos_control_center_shadow_runtime_status
              - sensor.poolos_control_center_last_evaluation
              - sensor.poolos_control_center_current_shadow_objective
              - sensor.poolos_control_center_last_shadow_plan
              - sensor.poolos_control_center_daily_counterfactual_report
              - sensor.poolos_control_center_operator_recommendation
          - type: markdown
            content: >-
              Daily evidence is exported automatically to `/config/poolos_logs/`
              as both JSONL and CSV. Upload the files for the desired date to
              ChatGPT for timeline and behavioral analysis.
